<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Open House Sign In</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B3A45">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin:0; height:100%; background:#0B3A45; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #off { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px;
         color:#FCF5E5; font:20px/1.5 Georgia, serif; background:#0B3A45; }
  #off b { color:#A78021; display:block; font-size:26px; margin-bottom:8px; }
</style>
</head>
<body>
<iframe id="app" title="Open House Sign In" allow="clipboard-write"></iframe>
<div id="off" hidden><div><b>No internet connection</b>Connect the tablet to wifi and the sign in screen will load on its own.</div></div>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwOQDj_TLQQN8lwyYFaJ1L9kYEEAiP9Rou6HUWGJC2qsN60Ku8r1nj8loVMMIjK6KEs/exec';
  var q = new URLSearchParams(location.search);
  var src = EXEC + (q.get('p') ? '?p=' + encodeURIComponent(q.get('p')) : '?m=app');
  var frame = document.getElementById('app'), off = document.getElementById('off');
  function load() { off.hidden = true; frame.src = src; }
  if (navigator.onLine) load(); else off.hidden = false;
  window.addEventListener('online', function () { if (!frame.src) load(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
